<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Scripts only from the app itself. Inline styles are allowed (the editor
      and Solid set style attributes); ws://localhost is Vite's HMR socket in
      dev and unused in the packaged app. chronicler-research: serves images
      and PDFs from the project's Research folder (main.ts); PDFs open in an
      iframe with Chromium's viewer. Read-aloud plays from blob: URLs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: chronicler-research:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; frame-src chronicler-research:; media-src 'self' blob: data:; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
