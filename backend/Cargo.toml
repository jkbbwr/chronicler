[package]
name = "chronicler-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
rusqlite = { version = "0.33", features = ["bundled"] }
regex = "1"
aho-corasick = "1.1.5"
ndarray = "0.17.2"
ort = "2.0.0-rc.13"
tokenizers = "0.23.1"
reqwest = { version = "0.13.4", features = ["json"] }
spellbook = "0.4.2"
nlprule = "0.6.4"
flate2 = "1.1.9"
harper-core = "2.8.0"
rig-core = "0.42.0"
rig-agent = "0.42.0"
futures = "0.3.34"

# harper's curated dictionary decode is unbearably slow unoptimized; keep
# these crates optimized even in dev builds so engine warm-up stays fast.
[profile.dev.package.harper-core]
opt-level = 3

[profile.dev.package.harper-brill]
opt-level = 3

[profile.dev.package.fst]
opt-level = 3
